    <!-- Prevent debugging -->
    <script>
      // Disable right-click context menu on production
      if (
        window.location.hostname !== "localhost" &&
        window.location.hostname !== "127.0.0.1"
      ) {
        document.addEventListener("contextmenu", (e) => e.preventDefault());
      }

      // Warn users attempting to access dev tools
      const devtools = { open: false, orientation: null };
      const threshold = 160;

      setInterval(() => {
        if (
          window.outerHeight - window.innerHeight > threshold ||
          window.outerWidth - window.innerWidth > threshold
        ) {
          if (!devtools.open) {
            devtools.open = true;
            devtools.orientation =
              window.outerHeight - window.innerHeight >
              window.outerWidth - window.innerWidth
                ? "vertical"
                : "horizontal";
          }
        } else {
          devtools.open = false;
          devtools.orientation = null;
        }
      }, 500);
    </script>

    <!-- Service Worker Registration -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/public/sw.js", { scope: "/" })
            .then((registration) => {
              console.log("[App] Service Worker registered:", registration);

              // Optional: Check for updates periodically
              setInterval(() => {
                registration.update();
              }, 60000); // Check every minute

              // Listen for new service worker activation
              registration.addEventListener("updatefound", () => {
                const newWorker = registration.installing;
                newWorker.addEventListener("statechange", () => {
                  if (
                    newWorker.state === "activated" &&
                    navigator.serviceWorker.controller
                  ) {
                    console.log("[App] New service worker activated");
                    // Optionally notify user about update
                  }
                });
              });
            })
            .catch((error) => {
              console.error("[App] Service Worker registration failed:", error);
            });
        });

        // Handle service worker messages
        navigator.serviceWorker.addEventListener("message", (event) => {
          if (event.data && event.data.type === "CACHE_UPDATED") {
            console.log("[App] Cache updated:", event.data.payload);
          }
        });
      }
    </script>
